version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      SQLITE_PATH: /data/smart_parking.sqlite
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PYTHON_PATH: python3
    volumes:
      - sqlite_data:/data
      - ./backend/detection/images:/app/detection/images
      - ./backend/detection/output:/app/detection/output
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend/sensor-enabled-smart-parking
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
