name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: ./backend/smart_parking.sqlite
      NODE_ENV: test
      E2E_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: ./backend
        run: npm ci
      - name: Run migrations
        working-directory: ./backend
        run: npm run migrate
      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/sensor-enabled-smart-parking/package-lock.json
      - name: Install frontend deps
        working-directory: ./frontend/sensor-enabled-smart-parking
        run: npm ci
      - name: Lint
        working-directory: ./frontend/sensor-enabled-smart-parking
        run: npm run lint || true
      - name: Build frontend
        working-directory: ./frontend/sensor-enabled-smart-parking
        run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t smart-parking-backend .
      - name: Build frontend image
        run: docker build -t smart-parking-frontend ./frontend/sensor-enabled-smart-parking

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          working-directory: ./frontend/sensor-enabled-smart-parking
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:login
          heroku container:push web -a ${{ secrets.HEROKU_APP_NAME }} --context-path .
          heroku container:release web -a ${{ secrets.HEROKU_APP_NAME }}
