version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-yourpassword}@db:5432/smart_parking
      DETECTION_SERVICE_URL: http://detection:5001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  detection:
    build: ./object-detection
    restart: unless-stopped
    environment:
      PORT: "5001"
      FLASK_DEBUG: "false"
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend/sensor-enabled-smart-parking
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
